name: Sync upstream NodeWarden

on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时一次，UTC 时间
  workflow_dispatch: # 支持在 Actions 页面手动执行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror upstream main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.mergeUpstream({
              owner: 'davidwei118',
              repo: 'Nodewarden',
              branch: 'main'
            })
